# ----------------------------------------
# CONFIGURACAO DO BANCO DE DADOS (POSTGRESQL)
# ----------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/LENPA
spring.datasource.username=postgres
# IMPORTANTE: Coloque a senha que você usa no seu Postgres aqui embaixo!
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# Faz o Spring/Hibernate criar e atualizar as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update

# Mostra no console os comandos SQL que o Spring esta fazendo
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

